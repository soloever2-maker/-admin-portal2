<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOS Admin — Change Password</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #D4AF37;
  --gold-light: #F4D03F;
  --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F4D03F 50%, #D4AF37 100%);
  --bg: #080C14;
  --surface: #0E1420;
  --surface2: #141C2E;
  --border: rgba(212,175,55,0.15);
  --text: #F0F4FF;
  --muted: #6B7A99;
  --danger: #EF4444;
  --success: #22C55E;
}
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 20%, rgba(212,175,55,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(212,175,55,0.04) 0%, transparent 60%);
  pointer-events: none;
}
.wrap { width: 100%; max-width: 420px; position: relative; }
.brand { text-align: center; margin-bottom: 26px; }
.brand img { width: 84px; height: 84px; object-fit: contain; display:block; margin: 0 auto 14px; }
.brand-name { display:block; font-family:'Syne',sans-serif; font-weight:800; font-size:18px; letter-spacing:3px; color:var(--text); }
.brand-sub { display:block; font-size:11px; letter-spacing:4px; color:var(--gold); margin-top:4px; text-transform:uppercase; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 30px 28px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.45);
}
.card-title { font-family:'Syne',sans-serif; font-weight:700; font-size:20px; color:var(--text); margin-bottom:6px; }
.card-sub { font-size:13px; color:var(--muted); margin-bottom:22px; line-height:1.5; }
.form-group { margin-bottom: 16px; }
.form-label { display:block; font-size:12px; font-weight:600; letter-spacing:0.5px; color:var(--muted); margin-bottom:7px; text-transform:uppercase; }
.input-wrap { position: relative; }
.input-wrap > i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; }
.form-input {
  width:100%; padding: 13px 44px 13px 40px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 11px; color: var(--text); font-size: 14px;
  font-family: inherit; outline: none; transition: border-color .2s;
}
.form-input:focus { border-color: var(--gold); }
.pw-toggle {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:4px;
}
.hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.btn-save {
  width:100%; padding: 14px; margin-top: 6px;
  background: var(--gold-grad); border:none; border-radius: 12px;
  font-family:'Syne',sans-serif; font-weight:700; font-size:14px; letter-spacing:1px;
  color:#080C14; cursor:pointer; transition: transform .15s, opacity .15s;
}
.btn-save:hover { transform: translateY(-1px); }
.btn-save:disabled { opacity: .5; cursor: not-allowed; transform:none; }
.msg { display:none; margin-top:14px; padding: 11px 14px; border-radius: 10px; font-size: 13px; }
.msg.error   { background: rgba(239,68,68,0.1);  border:1px solid rgba(239,68,68,0.3);  color:#FCA5A5; }
.msg.success { background: rgba(34,197,94,0.1);  border:1px solid rgba(34,197,94,0.3);  color:#86EFAC; }
.back-link { display:block; text-align:center; margin-top:18px; font-size:13px; color:var(--muted); text-decoration:none; }
.back-link:hover { color: var(--gold); }
.spinner { display:inline-block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <img src="logo.png" alt="NOS Logo">
    <span class="brand-name">NATIONS OF SKY</span>
    <span class="brand-sub">Admin Panel</span>
  </div>

  <div class="card">
    <div class="card-title">Change Password</div>
    <div class="card-sub" id="card-sub">Choose a new password for your account.</div>

    <div class="form-group">
      <label class="form-label">New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="new-pw" class="form-input" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="pw-toggle" onclick="togglePw('new-pw', this)"><i class="fas fa-eye"></i></button>
      </div>
      <div class="hint">8 characters minimum</div>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="confirm-pw" class="form-input" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="pw-toggle" onclick="togglePw('confirm-pw', this)"><i class="fas fa-eye"></i></button>
      </div>
    </div>

    <button class="btn-save" id="save-btn" onclick="doChange()">
      <i class="fas fa-check"></i> Update Password
    </button>

    <div class="msg" id="msg"></div>
  </div>

  <a class="back-link" id="back-link" href="index.html" style="display:none;">
    <i class="fas fa-arrow-left"></i> Back to Dashboard
  </a>
  <a class="back-link" href="#" onclick="doLogout(); return false;">
    <i class="fas fa-sign-out-alt"></i> Sign out
  </a>
</div>

<script src="js/supabase.js"></script>
<script>
// ═══════════════════════════════════════════
// تغيير الباسورد — بيشتغل في حالتين:
// 1) المستخدم عايز يغير باسورده العادي
// 2) إجباري بعد أول لوجين أو بعد ما الأدمن يعمل reset
// ═══════════════════════════════════════════

let mustChange = false;

function togglePw(id, btn) {
  const input = document.getElementById(id);
  const icon  = btn.querySelector('i');
  if (!input || !icon) return;
  input.type = input.type === 'password' ? 'text' : 'password';
  icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  if (!m) return;
  m.className = 'msg ' + type;
  m.style.display = 'block';
  m.innerHTML = (type === 'error' ? '<i class="fas fa-times-circle"></i> ' : '<i class="fas fa-check-circle"></i> ') + text;
}

async function doLogout() {
  try { await db.auth.signOut(); } catch(e) {}
  sessionStorage.clear();
  window.location.replace('login.html');
}

// ── تحقق من السيشن عند الفتح ──
(async function init() {
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.replace('login.html'); return; }

    const { data: profile } = await db
      .from('portal_users')
      .select('must_change_password, is_active')
      .eq('id', session.user.id)
      .single();

    if (!profile || !profile.is_active) { doLogout(); return; }

    mustChange = !!profile.must_change_password;
    if (mustChange) {
      document.getElementById('card-sub').innerText =
        'You must set a new password before continuing.';
    } else {
      document.getElementById('back-link').style.display = 'block';
    }
  } catch(e) {
    window.location.replace('login.html');
  }
})();

async function doChange() {
  const pw1 = document.getElementById('new-pw').value;
  const pw2 = document.getElementById('confirm-pw').value;
  const btn = document.getElementById('save-btn');

  if (!pw1 || !pw2) { showMsg('Please fill in both fields.', 'error'); return; }
  if (pw1.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); return; }
  if (pw1 !== pw2) { showMsg('Passwords do not match.', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Updating...';

  try {
    const { error } = await db.auth.updateUser({ password: pw1 });
    if (error) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check"></i> Update Password';
      showMsg(error.message || 'Could not update password.', 'error');
      return;
    }

    // اقفل عَلَم "لازم يغير الباسورد"
    try { await db.rpc('clear_must_change_password'); } catch(e) {}

    showMsg('Password updated successfully. Redirecting...', 'success');
    setTimeout(() => { window.location.replace('index.html'); }, 1200);

  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Update Password';
    showMsg('Something went wrong. Try again.', 'error');
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doChange(); });
</script>

</body>
</html>
